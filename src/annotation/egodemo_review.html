<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人–物交互 · 300 段审核台</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#192b34;background:#edf1f2;--green:#087f74;--line:#d6dfe2}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;background:#173c43;color:white;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:15px 0 7px}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.7}header p{margin:4px 0 0;font-size:13px;opacity:.8}button,input,select,textarea{font:inherit;border:1px solid #b9c8cc;border-radius:6px;padding:7px 10px;background:white;color:#192b34}button{cursor:pointer}button:hover{border-color:var(--green);background:#eff9f6}button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #70c9bc;outline-offset:2px}input[type=range]{padding:0;width:100%}label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#48616a}label.inline{display:inline-flex;flex-direction:row;align-items:center}main{padding:18px 24px;max-width:1850px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:15px}.stat{background:white;border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:150px}.stat strong{font-size:24px;margin-right:7px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(350px,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.toolbar select{max-width:100%;flex:1;min-width:180px}.toolbar input{max-width:170px}canvas{display:block;width:100%;height:auto;background:#18272c;border-radius:5px}.muted{font-size:12px;color:#5a7078}.hint{padding:9px 12px;background:#f7f2df;border-radius:5px;color:#705b29;font-size:13px}#notice{min-height:25px;padding:2px 0;font-size:13px;color:#1d6857}.scroll{max-height:230px;overflow:auto;border-top:1px solid var(--line)}.row{padding:10px 0;border-bottom:1px solid var(--line)}.row button{font-size:12px;padding:3px 8px;margin:3px}.row p{margin:4px 0}.row small{display:block;color:#637980}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .wide{grid-column:1/-1}textarea{resize:vertical;min-height:55px}select[multiple]{min-height:105px}details summary{cursor:pointer;font-weight:600}details[open] summary{margin-bottom:10px}.tag{font-size:11px;background:#eef4f3;padding:2px 6px;border-radius:4px;color:#426660}.title{overflow-wrap:anywhere}#time{font-variant-numeric:tabular-nums}.danger{color:#9e3730}.legend{display:flex;gap:15px;font-size:12px}.legend span:before{content:'●';margin-right:5px;color:var(--c)}@media(max-width:1000px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{padding:12px}.stat{min-width:130px;flex:1}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.toolbar input{max-width:110px}}
section,.card,label{min-width:0}input,select,textarea{max-width:100%;min-width:0}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}@media(max-width:480px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
<header><div><div class="eyebrow">动态人–物交互 / 私有研究工作区</div><h1>300 段联合标注审核台</h1><p>对齐双手、物体表面与交互时刻，保留刚体和非刚体的差异。</p></div><button id="refresh">刷新处理进度</button></header>
<main><div class="stats" id="stats"></div><div class="layout"><section>
<div class="card"><div class="toolbar"><input id="search" placeholder="搜索任务 / ID" aria-label="搜索采集"><select id="sequence" aria-label="选择采集"></select></div><h2 id="title" class="title">正在读取数据…</h2><div class="muted" id="uid"></div>
<div class="toolbar"><label class="inline"><input type="checkbox" id="showHands" checked>左右手</label><label class="inline"><input type="checkbox" id="showObjects" checked>物体候选 / 坐标轴</label></div><canvas id="view" width="960" height="728" aria-label="当前原生帧及手部、物体叠加"></canvas><div class="toolbar"><button id="seedDraw">圈选物体表面</button><button id="seedUndo">撤销顶点</button><button id="seedApply">将区域加入选中物体</button><button id="seedCancel">取消圈选</button></div><p class="muted">先在右侧选择或建立物体。圈选只保存表面种子，供失败区间重新跟踪使用；请避开手、手腕设备与背景。</p>
<div class="toolbar"><button data-step="-30">−30帧</button><button data-step="-1">上一帧</button><button data-step="1">下一帧</button><button data-step="30">+30帧</button><input type="number" id="frame" value="0" min="0" aria-label="帧号"><span id="time"></span></div><input type="range" id="timeline" min="0" value="0" aria-label="原生帧时间轴">
<div class="legend"><span style="--c:#26e3c0">左手</span><span style="--c:#ffbd58">右手</span><span style="--c:#b5ef64">表面点</span></div><p class="muted">物体坐标轴仅在几何估计有效时显示。没有坐标轴不代表物体不存在；轨迹编号仍需关联为稳定物体 ID。</p></div>
<div class="card"><h2>原文事件 · 中文草稿</h2><p class="muted">点击事件定位原区间。中文和物体名称待审；原区间还不是精确接触/抓持边界。</p><div id="events" class="scroll"></div></div>
</section><section>
<div class="card"><div class="hint">当前数据为候选标注。保存操作只保存待审草稿，不自动通过，也不启用训练。</div><div class="toolbar"><label>标注人<input id="reviewer" placeholder="填写姓名或代号"></label><button class="primary" id="save">保存到服务器</button><button id="export">导出 JSON</button></div><div id="notice" role="status" aria-live="polite"></div></div>
<div class="card"><h2>1. 确认实体与刚性类别</h2><div class="grid"><label>稳定物体 ID<input id="entityId" placeholder="obj_001"></label><label>中文名称<input id="entityName" placeholder="例如：电缆、扫码器"></label><label>表示类别<select id="rigidity"><option value="unknown">待确认</option><option value="rigid">刚体 · 6D 位姿</option><option value="deformable">非刚体 · 表面点 / 形变</option><option value="articulated">铰接 · 分部件表示</option></select></label><label>任务角色<select id="role"><option value="unknown">待确认</option><option value="tool">工具</option><option value="workpiece">工件 / 被操作物</option><option value="support">支撑物</option><option value="other">其他</option></select></label><label class="wide">关联已有轨迹（可多选；跨遮挡关联需人工核实）<select id="tracks" multiple></select></label></div><div class="toolbar"><button id="trackJump">定位选中轨迹</button><button id="entityApply" class="primary">新增 / 更新物体</button><button id="entityReset">清空表单</button></div><div id="entities" class="scroll"></div></div>
<div class="card"><h2>2. 定位交互、转换与协作</h2><div class="grid"><label>标注层<select id="layer"><option value="relation">持续关系</option><option value="transition">转换事件</option><option value="cooperation">协作关系</option><option value="operation">任务操作</option></select></label><label>类型<select id="type"></select></label><label>主体<select id="subject"><option value="left_hand">左手</option><option value="right_hand">右手</option><option value="both_hands">双手</option><option value="object">物体（在备注注明）</option></select></label><label>目标物体<select id="object"></select></label><label>第二物体（工具→工件 / 支撑关系）<select id="secondary"></select></label><span></span><label>开始帧（包含）<input id="start" type="number" min="0" value="0"></label><label>结束帧（包含）<input id="end" type="number" min="0" value="0"></label></div><div class="toolbar"><button id="markStart">当前帧设为开始</button><button id="markEnd">当前帧设为结束</button></div><label>可见性、边界依据与不确定性<textarea id="note" placeholder="例如：右手持工具，左手稳定工件；接触点被遮挡，边界待核。"></textarea></label><div class="toolbar"><button id="interactionApply" class="primary">新增交互草稿</button><button id="interactionReset">取消编辑</button></div><div id="interactions" class="scroll"></div></div>
</section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let catalog=null,data=null,draft=null,frameData=null,bitmap=null,frameNo=0,requestNo=0,dirty=false,editIndex=-1,seedDrawing=false,seedPoints=[];
const layerNames={relation:'持续关系',transition:'转换事件',cooperation:'协作关系',operation:'任务操作'};
const subjectNames={left_hand:'左手',right_hand:'右手',both_hands:'双手',object:'物体'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const option=(v,t)=>`<option value="${esc(v)}">${esc(t)}</option>`;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d;}
function notice(s,error=false){$('notice').textContent=s;$('notice').style.color=error?'#9e3730':'#1d6857';}
function changed(){dirty=true;notice('有未保存的草稿修改');}
function guarded(fn){return async()=>{try{await fn();}catch(e){notice(e.message,true);}};}
async function loadIndex(){catalog=await api('/api/index');const r=catalog.records;$('stats').innerHTML=[[r.length,'独立采集'],[r.filter(x=>x.stereo_checked).length,'双目时轴已检查'],[r.filter(x=>x.tracks_ready).length,'双向轨迹已处理'],[r.filter(x=>x.pose_frames>0).length,'过滤后有6D候选'],[r.filter(x=>x.hand_near_pose_frames>=5).length,'手附近有6D候选'],[r.filter(x=>x.proposal_ready).length,'身份与边界提案已生成'],[r.filter(x=>x.draft_saved).length,'已保存审核草稿']].map(([n,t])=>`<div class="stat"><strong>${n}</strong>${t}</div>`).join('');filter();}
function filter(){const key=$('search').value.toLowerCase(),current=data?.sequence_id;$('sequence').innerHTML=catalog.records.filter(r=>(r.task+' '+r.task_original+' '+r.id).toLowerCase().includes(key)).map(r=>option(r.id,`${r.tracks_ready?'◉':'○'} ${r.task} · ${r.id.slice(0,8)}`)).join('');if(current&&[...$('sequence').options].some(x=>x.value===current))$('sequence').value=current;}
async function selectSequence(){if(dirty){$('sequence').value=data.sequence_id;throw Error('请先保存当前草稿或导出，再切换采集');}const uid=$('sequence').value;if(!uid)return;data=await api('/api/sequence?id='+encodeURIComponent(uid));draft=data.draft;frameData=null;bitmap=null;$('title').textContent=data.task;$('uid').textContent=uid+' · '+data.metadata.frame_count+' 原生帧';$('reviewer').value=draft.reviewer||'';$('timeline').max=$('frame').max=data.metadata.frame_count-1;$('start').max=$('end').max=data.metadata.frame_count-1;$('tracks').innerHTML=data.tracks.records.map(r=>option(r.tracklet_id,`${r.visual_quality?.status==='rejected'?'[已拦截] ':''}${r.tracklet_id} · ${r.name_zh} · ${catalog.kinds[r.rigidity_candidate]} · 原始6D ${r.object_pose_frames}帧`)).join('');$('events').innerHTML=data.events.map((r,i)=>`<div class="row"><button data-event="${i}">定位 ${r.start_seconds.toFixed(2)}–${r.end_seconds.toFixed(2)} 秒</button><p>${esc(r.description_zh)}</p><small>${esc(r.description_original)}</small><span class="tag">${esc(r.operations.map(o=>o.name_zh).join(' / '))||'操作待补充'}</span></div>`).join('')||'<p class="muted">中文事件尚在处理。</p>';resetEntity();resetInteraction();renderDraft();notice(`已读取服务器草稿 · 版本 ${draft.revision}`);await seek(0);}
async function seek(n){if(!data)return;if(seedDrawing)throw Error('请先保存或取消当前圈选');const uid=data.sequence_id,id=++requestNo;frameNo=Math.min(data.metadata.frame_count-1,Math.max(0,Number(n)||0));$('frame').value=$('timeline').value=frameNo;const f=await api(`/api/frame?id=${uid}&frame=${frameNo}`);const im=new Image();im.src='data:image/jpeg;base64,'+f.jpeg;await im.decode();if(id!==requestNo||uid!==data.sequence_id)return;bitmap=im;frameData=f;$('time').textContent=`${f.seconds.toFixed(3)} 秒`;paint();}
function paint(){if(!bitmap||!frameData)return;const c=$('view'),ctx=c.getContext('2d'),f=frameData;c.width=bitmap.width;c.height=bitmap.height;ctx.drawImage(bitmap,0,0);const sx=c.width/f.width,sy=c.height/f.height;const valid=p=>p&&p.every(x=>x!==null&&Number.isFinite(x));const line=(a,b,col,w=2)=>{if(!valid(a)||!valid(b))return;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0]*sx,a[1]*sy);ctx.lineTo(b[0]*sx,b[1]*sy);ctx.stroke();};const label=(s,p,col)=>{if(!valid(p))return;ctx.font='14px sans-serif';const x=Math.max(0,Math.min(c.width-130,p[0]*sx)),y=Math.max(18,p[1]*sy);ctx.fillStyle='#112b36d9';ctx.fillRect(x-3,y-16,Math.min(c.width-x,ctx.measureText(s).width+8),21);ctx.fillStyle=col;ctx.fillText(s,x,y);};if($('showHands').checked)f.hands.forEach((h,side)=>{const color=['#26e3c0','#ffbd58'][side];for(let finger=0;finger<5;finger++){let last=0;for(let j=1+finger*4;j<=4+finger*4;j++){line(h[last],h[j],color);last=j;}}for(const p of h)if(valid(p)){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0]*sx,p[1]*sy,2.5,0,7);ctx.fill();}label(side?'右手':'左手',h[0],color);});if($('showObjects').checked)for(const o of f.objects){ctx.fillStyle=o.rejected?'#ff7373':'#b5ef64';for(const p of o.points)if(valid(p)){ctx.fillRect(p[0]*sx-1,p[1]*sy-1,3,3);}const entity=draft.entities.find(e=>e.tracklets.includes(o.id));if(o.points.length)label(entity?`${entity.id} ${entity.name_zh}`:`${o.id} · ${o.rejected?'已拦截':'待审'}`,o.points[0],'#d2f7a4');if(o.axes)for(let j=1;j<4;j++)line(o.axes[0],o.axes[j],['','#ff6464','#47ee91','#6bb5ff'][j],3);}}
const basePaint=paint;paint=function(){basePaint();if(!frameData)return;const c=$('view'),ctx=c.getContext('2d'),sx=c.width/frameData.width,sy=c.height/frameData.height;const polygons=(draft?.entities||[]).flatMap(e=>(e.seed_polygons||[]).filter(p=>p.frame_index===frameNo).map(p=>p.points_native));if(seedPoints.length)polygons.push(seedPoints);ctx.strokeStyle='#ff65e4';ctx.fillStyle='#ff65e430';ctx.lineWidth=3;for(const points of polygons){if(!points.length)continue;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0]*sx,p[1]*sy):ctx.moveTo(p[0]*sx,p[1]*sy));if(points.length>2){ctx.closePath();ctx.fill();}ctx.stroke();}};
function updateTypes(){$('type').innerHTML=Object.entries(catalog?.types[$('layer').value]||{}).map(([k,v])=>option(k,v)).join('');}
function renderDraft(){$('entities').innerHTML=draft.entities.map((e,i)=>`<div class="row"><b>${esc(e.id)} · ${esc(e.name_zh)}</b> <span class="tag">${esc(catalog.kinds[e.rigidity])}</span><small>${esc(e.tracklets.join('，'))||'尚未关联轨迹'}</small><button data-edit-entity="${i}">编辑</button><button data-delete-entity="${i}">删除</button></div>`).join('')||'<p class="muted">先确认物体身份，再关联交互。也可为尚未检出的物体建立ID。</p>';$('object').innerHTML=draft.entities.map(e=>option(e.id,e.id+' · '+e.name_zh)).join('');$('secondary').innerHTML=option('','无 / 待确认')+$('object').innerHTML;$('interactions').innerHTML=draft.interactions.map((r,i)=>`<div class="row"><b>${r.label_source==='geometry_proposal'?'[几何提案] ':''}${esc(layerNames[r.layer])} · ${esc(catalog.types[r.layer][r.type])}</b><p>${esc(subjectNames[r.subject])} → ${esc(r.object_id)}${r.secondary_object_id?' → '+esc(r.secondary_object_id):''} · 帧 ${r.start_frame}–${r.end_frame-1}</p><small>${esc(r.note)}</small><button data-edit-interaction="${i}">编辑</button><button data-jump-interaction="${i}">定位</button><button data-delete-interaction="${i}">删除</button></div>`).join('');paint();}
$('seedDraw').onclick=()=>{if(!data)return;seedDrawing=true;seedPoints=[];notice('在图像上依次点击物体边界顶点，然后加入物体并保存。');};$('seedUndo').onclick=()=>{seedPoints.pop();paint();};$('seedCancel').onclick=()=>{seedDrawing=false;seedPoints=[];paint();};$('view').addEventListener('click',e=>{if(!seedDrawing||!frameData)return;const r=$('view').getBoundingClientRect();seedPoints.push([(e.clientX-r.left)/r.width*frameData.width,(e.clientY-r.top)/r.height*frameData.height]);paint();});$('seedApply').onclick=guarded(()=>{const entity=draft.entities.find(e=>e.id===$('entityId').value.trim());if(!entity)throw Error('请先新增物体，或在实体列表点编辑');if(seedPoints.length<3)throw Error('至少点击三个顶点');entity.seed_polygons=entity.seed_polygons||[];entity.seed_polygons.push({frame_index:frameNo,points_native:seedPoints.map(p=>p.map(x=>Math.round(x*100)/100)),source:'reviewer_polygon',review_status:'pending',label_valid:false});seedDrawing=false;seedPoints=[];changed();paint();});
function resetEntity(){$('entityId').value='obj_'+String(draft?draft.entities.length+1:1).padStart(3,'0');$('entityName').value='';$('rigidity').value='unknown';$('role').value='unknown';for(const o of $('tracks').options)o.selected=false;}
function resetInteraction(){editIndex=-1;$('interactionApply').textContent='新增交互草稿';$('note').value='';}
function applyEntity(){const e={id:$('entityId').value.trim(),name_zh:$('entityName').value.trim(),rigidity:$('rigidity').value,role:$('role').value,tracklets:[...$('tracks').selectedOptions].map(o=>o.value),review_status:'pending',label_valid:false};if(!/^obj_[A-Za-z0-9_]{1,64}$/.test(e.id)||!e.name_zh)throw Error('请填写 obj_ 开头的稳定ID与中文名称');if(draft.entities.some(x=>x.id!==e.id&&x.tracklets.some(t=>e.tracklets.includes(t))))throw Error('同一轨迹不能分配给多个物体');const i=draft.entities.findIndex(x=>x.id===e.id);if(i<0)draft.entities.push(e);else{const old=draft.entities[i];if(JSON.stringify(old.tracklets)!==JSON.stringify(e.tracklets)){delete old.track_to_object_transforms;old.reference_alignment_requires_recompute=true;}draft.entities[i]={...old,...e};}changed();renderDraft();resetEntity();}
function applyInteraction(){const r={layer:$('layer').value,type:$('type').value,subject:$('subject').value,object_id:$('object').value,secondary_object_id:$('secondary').value||null,start_frame:Number($('start').value),end_frame:Number($('end').value)+1,note:$('note').value,review_status:'pending',label_valid:false};if(!r.object_id)throw Error('请先建立目标物体ID');if(!Number.isInteger(r.start_frame)||!Number.isInteger(r.end_frame)||r.start_frame<0||r.end_frame<=r.start_frame||r.end_frame>data.metadata.frame_count)throw Error('请检查起止帧');if(editIndex<0)draft.interactions.push(r);else draft.interactions[editIndex]=r;changed();renderDraft();resetInteraction();}
async function save(){draft.reviewer=$('reviewer').value.trim();const saved=await api('/api/draft',draft);draft=saved;dirty=false;notice(`已保存到服务器 · 版本 ${draft.revision} · 仍为待审草稿`);}
$('refresh').onclick=guarded(async()=>{await loadIndex();if(!dirty)await selectSequence();});$('search').oninput=filter;$('sequence').onchange=guarded(selectSequence);$('layer').onchange=updateTypes;$('frame').onchange=guarded(()=>seek($('frame').value));$('timeline').onchange=guarded(()=>seek($('timeline').value));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=guarded(()=>seek(frameNo+Number(b.dataset.step))));$('showHands').onchange=$('showObjects').onchange=paint;$('reviewer').oninput=changed;$('save').onclick=guarded(save);$('entityApply').onclick=guarded(applyEntity);$('entityReset').onclick=resetEntity;$('interactionApply').onclick=guarded(applyInteraction);$('interactionReset').onclick=resetInteraction;$('markStart').onclick=()=>{$('start').value=frameNo};$('markEnd').onclick=()=>{$('end').value=frameNo};$('trackJump').onclick=guarded(()=>{const r=data.tracks.records.find(r=>r.tracklet_id===$('tracks').value);if(r){if(r.visual_quality)notice(r.visual_quality.reason_zh,r.visual_quality.status==='rejected');return seek(r.start_frame)}});
$('tracks').onchange=()=>{const r=data.tracks.records.find(r=>r.tracklet_id===$('tracks').value);if(r&&!$('entityName').value){$('entityName').value=r.name_zh;$('rigidity').value=r.rigidity_candidate;}};
$('events').addEventListener('click',e=>{const b=e.target.closest('[data-event]');if(!b)return;const r=data.events[Number(b.dataset.event)];guarded(async()=>{await seek(r.start_frame);$('start').value=r.start_frame;$('end').value=r.end_frame-1;notice('已按原生时间戳定位原文区间；请逐帧细化交互边界。');})();});
$('entities').addEventListener('click',e=>{const edit=e.target.dataset.editEntity,del=e.target.dataset.deleteEntity;if(edit!==undefined){const x=draft.entities[Number(edit)];$('entityId').value=x.id;$('entityName').value=x.name_zh;$('rigidity').value=x.rigidity;$('role').value=x.role;for(const o of $('tracks').options)o.selected=x.tracklets.includes(o.value);}if(del!==undefined){const x=draft.entities[Number(del)];if(draft.interactions.some(r=>r.object_id===x.id||r.secondary_object_id===x.id)){notice('该物体仍被交互引用，请先修改交互。',true);return;}draft.entities.splice(Number(del),1);changed();renderDraft();}});
$('interactions').addEventListener('click',e=>{const edit=e.target.dataset.editInteraction,jump=e.target.dataset.jumpInteraction,del=e.target.dataset.deleteInteraction;if(edit!==undefined){editIndex=Number(edit);const r=draft.interactions[editIndex];$('layer').value=r.layer;updateTypes();$('type').value=r.type;$('subject').value=r.subject;$('object').value=r.object_id;$('secondary').value=r.secondary_object_id||'';$('start').value=r.start_frame;$('end').value=r.end_frame-1;$('note').value=r.note||'';$('interactionApply').textContent='更新交互草稿';}if(jump!==undefined)guarded(()=>seek(draft.interactions[Number(jump)].start_frame))();if(del!==undefined){draft.interactions.splice(Number(del),1);changed();renderDraft();resetInteraction();}});
$('export').onclick=()=>{draft.reviewer=$('reviewer').value.trim();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));a.download=data.sequence_id+'-审核草稿.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
guarded(async()=>{await loadIndex();updateTypes();await selectSequence();})();
</script></html>
